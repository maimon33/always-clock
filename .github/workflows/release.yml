name: Release Always Clock

on:
  push:
    tags:
      - 'v*'  # v1.4 -> version 1.4
  workflow_dispatch:  # manual run builds artifacts; publishes only from a tag

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write  # create the release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # git describe / rev-list need full history

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Detect signing secrets
      id: signing
      env:
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      run: |
        signed=true
        for var in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD APPLE_TEAM_ID APPLE_SIGN_IDENTITY \
                   APPLE_INSTALLER_IDENTITY ASC_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
          if [ -z "${!var}" ]; then
            signed=false
          fi
        done
        if [ "$signed" = true ]; then
          echo "Signing secrets found: building a signed and notarized release"
        else
          echo "::warning::Signing secrets not set: building unsigned artifacts"
        fi
        echo "signed=$signed" >> "$GITHUB_OUTPUT"

    - name: Import signing certificate and notary key
      if: steps.signing.outputs.signed == 'true'
      env:
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      run: |
        KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
        KEYCHAIN_PASSWORD=$(uuidgen)

        echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        rm -f "$RUNNER_TEMP/cert.p12"

        echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

        echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
        echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
        echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

        security find-identity -v -p codesigning "$KEYCHAIN"

    - name: Build, sign and notarize
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        SIGNED: ${{ steps.signing.outputs.signed }}
      run: |
        chmod +x *.sh
        if [ "$SIGNED" = true ]; then
          export SIGN_IDENTITY="$APPLE_SIGN_IDENTITY"
          export INSTALLER_IDENTITY="$APPLE_INSTALLER_IDENTITY"
          export APPLE_TEAM_ID
        fi
        ./distribute.sh

    - name: Read version
      id: version
      run: |
        source ./version.sh
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "dmg_sha256=$(shasum -a 256 "dist/Always-Clock-v$VERSION.dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Update Homebrew tap
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
        SHA256: ${{ steps.version.outputs.dmg_sha256 }}
      run: |
        if [ -z "$TAP_TOKEN" ]; then
          echo "::warning::HOMEBREW_TAP_TOKEN not set: skipping tap update"
          exit 0
        fi
        git clone --quiet "https://x-access-token:$TAP_TOKEN@github.com/maimon33/homebrew-always-clock.git" tap
        mkdir -p tap/Casks
        cat > tap/Casks/always-clock.rb << EOF
        cask "always-clock" do
          version "$VERSION"
          sha256 "$SHA256"

          url "https://github.com/maimon33/always-clock/releases/download/v#{version}/Always-Clock-v#{version}.dmg"
          name "Always Clock"
          desc "Always-on-top transparent clock for macOS"
          homepage "https://github.com/maimon33/always-clock"

          depends_on macos: ">= :ventura"

          app "Always Clock.app"

          caveats <<~EOS
            If macOS says Always Clock can't be opened, run:
              xattr -dr com.apple.quarantine "/Applications/Always Clock.app"
          EOS

          zap trash: [
            "~/Library/Preferences/com.alwaysclock.app.plist",
          ]
        end
        EOF
        cd tap
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Casks/always-clock.rb
        git commit -m "Update Always Clock cask to $VERSION" || { echo "Cask already up to date"; exit 0; }
        git push origin HEAD:main

    - name: Write release notes
      env:
        VERSION: ${{ steps.version.outputs.version }}
        SIGNED: ${{ steps.signing.outputs.signed }}
      run: |
        {
          echo "# Always Clock v$VERSION"
          echo ""
          echo "## Installation"
          echo "- **DMG** (recommended): open it and drag Always Clock to Applications"
          echo "- **PKG**: double-click and follow the installer"
          echo "- **ZIP**: extract and drag Always Clock to Applications"
          echo "- **Homebrew**: \`brew tap maimon33/always-clock && brew install --cask always-clock\`"
          echo ""
          if [ "$SIGNED" != true ]; then
            echo "## First launch (unsigned build)"
            echo "This build is not signed by Apple, so macOS blocks it the first time."
            echo "Right-click Always Clock → **Open**, or run:"
            echo ""
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine "/Applications/Always Clock.app"'
            echo '```'
            echo ""
          fi
          echo "## Usage"
          echo "- The clock is click-through; open **Settings** (⌘⇧T or the menu bar icon) to drag it or pick a preset position"
          echo "- Requires macOS 13.0 (Ventura) or later"
        } > RELEASE_NOTES.md

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Always Clock v${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES.md
        files: |
          dist/*.dmg
          dist/*.pkg
          dist/*.zip

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: always-clock-${{ steps.version.outputs.version }}
        path: |
          dist/*.dmg
          dist/*.pkg
          dist/*.zip
        retention-days: 30

    - name: Clean up keychain
      if: always() && steps.signing.outputs.signed == 'true'
      run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
