name: Release Always Clock

on:
  push:
    tags:
      - 'v*'  # v1.4 -> version 1.4
  workflow_dispatch:  # manual run builds unsigned artifacts; no release is published

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write  # create the release and commit the Homebrew cask

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # git describe / rev-list need full history

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Require signing secrets for tag releases
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      run: |
        missing=0
        for var in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD APPLE_TEAM_ID APPLE_SIGN_IDENTITY \
                   APPLE_INSTALLER_IDENTITY ASC_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
          if [ -z "${!var}" ]; then
            echo "::error::Secret $var is not set; a release must be signed and notarized"
            missing=1
          fi
        done
        exit $missing

    - name: Import signing certificate and notary key
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      run: |
        KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
        KEYCHAIN_PASSWORD=$(uuidgen)

        echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        rm -f "$RUNNER_TEMP/cert.p12"

        echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

        echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
        echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
        echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

        security find-identity -v -p codesigning "$KEYCHAIN"

    - name: Build, sign and notarize
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      run: |
        chmod +x *.sh
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          export SIGN_IDENTITY="$APPLE_SIGN_IDENTITY"
          export INSTALLER_IDENTITY="$APPLE_INSTALLER_IDENTITY"
          export APPLE_TEAM_ID
        fi
        ./distribute.sh

    - name: Read version
      id: version
      run: |
        source ./version.sh
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "dmg_sha256=$(shasum -a 256 "dist/Always-Clock-v$VERSION.dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Update Homebrew cask
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        VERSION: ${{ steps.version.outputs.version }}
        SHA256: ${{ steps.version.outputs.dmg_sha256 }}
      run: |
        cat > homebrew/always-clock.rb << EOF
        cask "always-clock" do
          version "$VERSION"
          sha256 "$SHA256"

          url "https://github.com/maimon33/always-clock/releases/download/v#{version}/Always-Clock-v#{version}.dmg"
          name "Always Clock"
          desc "Always-on-top transparent clock for macOS"
          homepage "https://github.com/maimon33/always-clock"

          depends_on macos: ">= :ventura"

          app "Always Clock.app"

          zap trash: [
            "~/Library/Preferences/com.alwaysclock.app.plist",
          ]
        end
        EOF
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add homebrew/always-clock.rb
        git commit -m "Update Homebrew cask to $VERSION" || echo "Cask already up to date"
        git push origin HEAD:main || echo "::warning::Could not push cask update to main"

    - name: Write release notes
      run: |
        cat > RELEASE_NOTES.md << EOF
        # Always Clock v${{ steps.version.outputs.version }}

        ## Installation
        - **DMG** (recommended): open it and drag Always Clock to Applications
        - **PKG**: double-click and follow the installer
        - **ZIP**: extract and drag Always Clock to Applications
        - **Homebrew**: \`brew install --cask always-clock\`

        ## Usage
        - The clock is click-through; open **Settings** (⌘⇧T or the menu bar icon) to drag it or pick a preset position
        - Requires macOS 13.0 (Ventura) or later
        EOF

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Always Clock v${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES.md
        files: |
          dist/*.dmg
          dist/*.pkg
          dist/*.zip

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: always-clock-${{ steps.version.outputs.version }}
        path: |
          dist/*.dmg
          dist/*.pkg
          dist/*.zip
        retention-days: 30

    - name: Clean up keychain
      if: always()
      run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
