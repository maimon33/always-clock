name: Build Always Clock App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # version.sh reads git tags and commit count

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build unsigned distribution
      run: |
        chmod +x *.sh
        ./distribute.sh

    - name: Upload distribution files
      uses: actions/upload-artifact@v4
      with:
        name: always-clock-dist
        path: |
          dist/Always Clock.app
          dist/*.dmg
          dist/*.pkg
          dist/*.zip
        retention-days: 30
